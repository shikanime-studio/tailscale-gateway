apiVersion: skaffold/v4beta1
kind: Config
metadata:
  name: tailscale-gateway
build:
  artifacts:
    - image: ghcr.io/shikanime-studio/tailscale-gateway/controller
      ko:
        dependencies:
          paths:
            - cmd/tailscale-gateway-controller
            - internal
            - go.mod
            - go.sum
        dir: ./cmd/tailscale-gateway-controller
        fromImage: cgr.dev/chainguard/glibc-dynamic
profiles:
  - name: default
    manifests:
      kustomize:
        paths:
          - manifests/gateway/base
  - name: demo
    manifests:
      kustomize:
        paths:
          - manifests/demo
          - manifests/gateway
