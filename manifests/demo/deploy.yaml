apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-front
  namespace: tailscale-gateway-demo
  labels:
    app: demo-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-front
  template:
    metadata:
      labels:
        app: demo-front
    spec:
      containers:
        - name: caddy
          image: caddy:latest
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: caddy-config
          configMap:
            name: demo-front
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: tailscale-gateway-demo
  labels:
    app: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: caddy
          image: caddy:latest
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: caddy-config
          configMap:
            name: demo-api
