# Example HTTPRoute for routing traffic through the Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: tailscale-gateway-demo
spec:
  parentRefs:
    - name: demo
  hostnames:
    - demo
  rules:
    - backendRefs:
        - name: demo
          port: 80
