# Example HTTPRoute for routing traffic through the Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: tailscale-gateway-demo
spec:
  parentRefs:
    - name: demo
  hostnames:
    - demo
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: demo-api-v1
          port: 80
          weight: 80
        - name: demo-api-v2
          port: 80
          weight: 20
    - backendRefs:
        - name: demo
          port: 80
