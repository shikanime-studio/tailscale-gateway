apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: tailscale-gateway-demo
spec:
  hostnames:
    - demo
  parentRefs:
    - name: demo
  rules:
    - backendRefs:
        - name: demo-api
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /api
    - backendRefs:
        - name: demo-front
          port: 80
