apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - httproute.yaml
  - ns.yaml
  - svc.yaml
  - deploy.yaml
configMapGenerator:
  - name: demo-front
    namespace: tailscale-gateway-demo
    files:
      - front/Caddyfile
  - name: demo-api
    namespace: tailscale-gateway-demo
    files:
      - api/Caddyfile
