apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: tailscale-gateway-demo
spec:
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-v1
  namespace: tailscale-gateway-demo
  labels:
    app: demo-api-v1
spec:
  selector:
    app: demo-api-v1
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-v2
  namespace: tailscale-gateway-demo
  labels:
    app: demo-api-v2
spec:
  selector:
    app: demo-api-v2
  ports:
    - name: http
      port: 80
      targetPort: http
