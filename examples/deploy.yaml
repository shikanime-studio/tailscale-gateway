apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: tailscale-gateway-demo
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/instance: demo
    app.kubernetes.io/part-of: tailscale-gateway-demo
    app.kubernetes.io/component: application
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/instance: demo
        app.kubernetes.io/part-of: tailscale-gateway-demo
        app.kubernetes.io/component: application
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: demo-app
          image: nginx:alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
