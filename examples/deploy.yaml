apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: tailscale-gateway-demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
    spec:
      containers:
        - name: demo
          image: nginx:alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
